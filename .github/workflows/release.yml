name: Release

# Push a tag like v0.2.0 to build the universal app and publish a draft
# GitHub release with the DMG and the updater manifest (latest.json).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # arm64 natively, x86_64 cross-compiled, then joined with lipo.
      - name: Build universal lc0
        run: |
          engine/build-lc0.sh --universal
          lipo -info src-tauri/binaries/lc0-universal-apple-darwin

      - run: pnpm install --frozen-lockfile

      # Developer ID signing and notarisation switch on when these secrets
      # exist (see docs/RELEASING.md); otherwise the build is ad-hoc signed.
      - name: Apple signing environment
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            echo "Developer ID signing enabled"
          else
            echo "No Developer ID: the app will be ad-hoc signed"
          fi
          if [ -n "$APPLE_API_KEY" ]; then
            key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key"
            {
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_API_KEY=$APPLE_API_KEY"
              echo "APPLE_API_KEY_PATH=$key"
            } >> "$GITHUB_ENV"
            echo "Notarisation enabled"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Grandie Chess ${{ github.ref_name }}
          releaseBody: See the assets below. On first launch of an unsigned build, approve it in System Settings → Privacy & Security.
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin

      # The DMG's name includes the version. A copy under a fixed name gives one
      # download link that always serves the newest published release:
      # https://github.com/Inad-Tech-World/grandie_chess/releases/latest/download/Grandie-Chess.dmg
      - name: Upload the DMG under a fixed name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          cp "$dmg" "$RUNNER_TEMP/Grandie-Chess.dmg"
          gh release upload "${{ github.ref_name }}" "$RUNNER_TEMP/Grandie-Chess.dmg" --clobber
